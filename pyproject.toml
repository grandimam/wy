[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wy-code"
version = "0.1.0"
description = "Understand the engineering decisions behind AI-generated code"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "typer>=0.12,<1",
    "pydantic>=2.8,<3",
    "rich>=13,<16",
    "textual[syntax]>=8.2.8,<9",
]

[project.scripts]
wy = "wy.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/wy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
