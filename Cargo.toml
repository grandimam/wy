[package]
name = "wy-code"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Understand decisions and captured code from local AI coding sessions"
license = "MIT"
repository = "https://github.com/grandimam/wy"
default-run = "wy"

[[bin]]
name = "wy"
path = "src/main.rs"

[lib]
name = "wy"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
jsonschema = { version = "0.29", default-features = false }
libc = "0.2"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2.7"
tempfile = "3"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[profile.release]
lto = "thin"
strip = true

[profile.dist]
inherits = "release"
